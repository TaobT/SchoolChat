apiVersion: v1
kind: PersistentVolume
metadata:
  name: dynamodb-local-pv
  labels:
    type: local
    app: dynamodb-local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /home/dynamodblocal/data
  persistentVolumeReclaimPolicy: Retain